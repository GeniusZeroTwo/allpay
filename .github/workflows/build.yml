name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本 Tag（例如 v1.0.0）。若留空，则仅构建产物而不发布到 GitHub Releases。'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test-allpay:
    name: Test & Build AllPay Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run Tests
        run: bun run test

      - name: Build Web Frontend
        run: bun run build

  build-hooks:
    name: Build WeChat Hooks (Plan A & B)
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Build WeChat Hook 方案 B (微信 3.9.12.51)
        run: |
          New-Item -ItemType Directory -Force -Path out
          cd wechat-hook/v3
          New-Item -ItemType Directory -Force -Path Out
          nuget restore Hook.sln
          msbuild Hook.sln /p:Configuration=Release /p:Platform=x64

          Set-Content -Path Out/config.properties -Value "# AllPay 微信 PC Hook 方案 B 配置文件`r`n# 适用微信版本：3.9.12.51`r`n# Hook 接收端点地址（若网关后台设置了通信 Token，追加 ?token=xxx）`r`napi_url=http://127.0.0.1:3000/api/hook/receive`r`n"
          Copy-Item LICENSE Out/LICENSE
          if (Test-Path README.md) { Copy-Item README.md Out/使用说明.md }
          cd Out
          Compress-Archive -Path '*' -DestinationPath '../../../out/WeChat-Hook-v3-PlanB.zip' -Force
          cd ../../../

      - name: Build WeChat Hook 方案 A (微信 4.1.0.34 - 4.1.2.17)
        run: |
          cd wechat-hook/v4
          New-Item -ItemType Directory -Force -Path Out
          cmd /c build.cmd

          Set-Content -Path Out/config.properties -Value "# AllPay 微信 PC Hook 方案 A 配置文件`r`n# 适用微信版本：4.1.0.34 ~ 4.1.2.17`r`n# Hook 接收端点地址（若网关后台设置了通信 Token，追加 ?token=xxx）`r`napi_url=http://127.0.0.1:3000/api/hook/receive`r`nwechat_key=`r`ndatabase_folder=auto`r`n"
          Copy-Item LICENSE Out/LICENSE
          if (Test-Path README.md) { Copy-Item README.md Out/使用说明.md }
          cd Out
          Compress-Archive -Path '*' -DestinationPath '../../../out/WeChat-Hook-v4-PlanA.zip' -Force
          cd ../../../

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wechat-hooks
          path: out/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Releases
    needs: [test-allpay, build-hooks]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download Hook Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wechat-hooks
          path: release-assets

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: |
            release-assets/WeChat-Hook-v4-PlanA.zip
            release-assets/WeChat-Hook-v3-PlanB.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
